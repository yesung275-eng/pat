name: 보세샵 상품 자동 업데이트

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 한국시간 새벽 3시 17분
  workflow_dispatch:         # 버튼으로 바로 실행하기

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_shops.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "pafit-bot"
          git config user.email "pafit-bot@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || git commit -m "보세샵 상품 업데이트 $(date +'%Y-%m-%d')"
          git push
